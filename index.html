<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#214e40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>台江昆蟲圖鑑 · Taijiang Insects</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1a1f1e; --ink2:#2f3a38; --bg:#f4efe4; --card:#fffdf8; --line:#cfc6b3;
  --teal:#214e40; --teal2:#2a7a73; --sand:#d9b26a; --rust:#9a4a3a; --sky:#2f6b9a; --moss:#5c7d3a;
  --fs:17px; --radius:10px;
}
html[data-fs="1"]{--fs:19px}
html[data-fs="2"]{--fs:21px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC","Noto Sans CJK TC","Microsoft JhengHei","Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.5;font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
em,i{font-style:italic}
.hide{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;padding:env(safe-area-inset-top) 0 0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hbar{display:flex;align-items:center;gap:8px;padding:8px 12px;height:56px}
.hbar h1{flex:1;margin:0;font-size:1.12em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.hbtn{min-width:48px;height:40px;border:2px solid rgba(255,255,255,.85);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 10px;color:#fff;background:rgba(255,255,255,.08)}
.hbtn.back{min-width:44px;padding:0}
.hbtn svg{width:24px;height:24px}

main{padding:12px 12px 90px;max-width:760px;margin:0 auto}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);display:flex;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink2);font-size:.78em;font-weight:600;line-height:1.1}
nav.tabs button svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--teal)}
nav.tabs button.on::after{content:"";width:28px;height:3px;background:var(--teal);border-radius:2px;margin-top:1px}

/* language gate */
#gate{position:fixed;inset:0;z-index:50;background:var(--teal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate .logo{width:120px;height:120px;margin-bottom:16px}
#gate h2{margin:0 0 4px;font-size:1.7em;font-weight:800}
#gate .sub{opacity:.92;font-size:1.05em;margin-bottom:28px;line-height:1.45}
#gate .langs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
#gate .langs button{background:#fff;color:var(--teal);font-size:1.15em;font-weight:800;padding:18px 8px;border-radius:12px;border:3px solid #fff}
#gate .langs button:active{background:#e8f1f0}

/* generic blocks */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:1.05em;font-weight:800;color:var(--teal)}
.sec{margin:14px 0 6px;font-size:.95em;font-weight:800;color:var(--teal);letter-spacing:.03em}
p{margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:2px solid var(--teal);border-radius:7px;padding:7px 12px;font-weight:700;color:var(--teal);background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip.on{background:var(--teal);color:#fff}
.chip svg{width:22px;height:22px}
.chip .n{font-size:.8em;opacity:.8}
.chip.on .n{opacity:.9}
.bgrp{display:grid;gap:8px;margin:6px 0 12px}
.bgrp.c2{grid-template-columns:1fr 1fr}.bgrp.c3{grid-template-columns:1fr 1fr 1fr}.bgrp.c4{grid-template-columns:repeat(4,1fr)}.bgrp.c6{grid-template-columns:repeat(6,1fr)}
.bgrp .chip{justify-content:center;text-align:center;padding:9px 6px;white-space:normal}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:6px 10px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;padding:6px 0}
.search svg{width:22px;height:22px;stroke:var(--ink2);fill:none;stroke-width:2.2}
.muted{color:var(--ink2);font-size:.92em}
.count{font-weight:800;color:var(--teal);margin:4px 0 8px}

/* species list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:8px;text-align:left;width:100%}
.thumb{width:86px;height:86px;flex:none;border-radius:8px;background:#e9e2d2;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:60px;height:60px;opacity:.75}
.item .t{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:1.05em;line-height:1.25}
.item .sci{font-style:italic;color:var(--ink2);font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:.8em}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-weight:700;background:#ebe5d6;color:var(--ink2)}
.tag.now{background:var(--sand);color:#3b2a08}
.tag.endemic{background:#dfeedc;color:#2f5a1f}.tag.sub{background:#dfeedc;color:#2f5a1f}.tag.exotic{background:#f3dcd7;color:#7a2d1f}
.order-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-weight:800;color:var(--teal)}
.order-head svg{width:32px;height:32px}
.order-head .en{font-weight:600;color:var(--ink2);font-size:.9em}

/* detail */
.photos{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.photos .ph{border-radius:var(--radius);overflow:hidden;background:#e9e2d2;min-height:200px;display:flex;align-items:center;justify-content:center;position:relative}
.photos .ph img{width:100%;display:block}
.photos .ph svg{width:140px;height:140px;opacity:.7}
.photos .ph .nophoto{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(255,253,248,.92);border-radius:6px;padding:6px 8px;font-size:.82em;color:var(--ink2);font-weight:600}
.dname{font-size:1.6em;font-weight:900;line-height:1.2;margin:0}
.onames{color:var(--ink2);font-weight:600;margin:4px 0 2px;line-height:1.35}
.dsci{font-style:italic;font-size:1.05em;margin:0 0 8px}
.taxo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.taxo .tag{font-size:.9em;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}.taxo .tag svg{width:24px;height:24px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0 4px}
.months div{height:40px;border-radius:5px;background:#ece6d7;color:#8a826f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;position:relative}
.months div.on{background:#e4852b;color:#fff}
.months div.cur{outline:3px solid var(--ink);outline-offset:-3px}
.months div.cur::after{content:"▲";position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:.7em;color:var(--ink)}
.months-wrap{margin-bottom:22px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.tagrow .ht{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:5px 10px;font-weight:700;font-size:.92em;border:2px solid transparent}
.tagrow .ht svg{width:22px;height:22px}
.ht.hab{background:#f0ddd7;color:#6b2d20;border-color:#b25a48}.ht.mic{background:#dde8f2;color:#1f4a6e;border-color:#4b7fab}.ht.act{background:#e6e0ee;color:#3f2f5a;border-color:#7a6498}
.ruler{margin:6px 0 12px}
.ruler svg{width:100%;height:46px;display:block}
.prevnext{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.prevnext button{border:2px solid var(--teal);border-radius:var(--radius);padding:10px;color:var(--teal);font-weight:700;text-align:left;background:var(--card);line-height:1.25}
.prevnext button.next{text-align:right}
.prevnext small{display:block;color:var(--ink2);font-weight:600;font-size:.8em}

/* learn */
details.lrn{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:0 14px}
details.lrn summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:800;font-size:1.05em;color:var(--teal);display:flex;align-items:center;gap:10px}
details.lrn summary::-webkit-details-marker{display:none}
details.lrn summary svg.ic{width:30px;height:30px;flex:none}
details.lrn summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:3px solid var(--teal);border-bottom:3px solid var(--teal);transform:rotate(45deg);transition:.2s}
details.lrn[open] summary::after{transform:rotate(-135deg)}
details.lrn .body{padding:0 0 12px}
.fig{background:#fbf8f1;border:2px solid var(--line);border-radius:8px;padding:8px;margin:8px 0 12px}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:.88em;color:var(--ink2);text-align:center;margin-top:4px;font-weight:600}
.kv{margin:0 0 10px}.kv b{color:var(--teal)}
.sub-card{border-left:4px solid var(--sand);padding:4px 0 4px 10px;margin:8px 0}
.sub-card b{display:block;color:var(--teal)}

/* key */
.key-q{font-size:1.15em;font-weight:800;margin:0 0 10px}
.key-opts{display:grid;gap:10px;margin-bottom:12px}
.key-opts button{border:2px solid var(--teal);border-radius:var(--radius);background:var(--card);padding:12px 14px;text-align:left;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px}
.key-opts button svg{width:36px;height:36px;flex:none}
.key-res{background:#e9f1ef;border:2px solid var(--teal);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.key-res .big{font-size:1.3em;font-weight:900;color:var(--teal)}
.linkbtn{border:2px solid var(--teal);border-radius:8px;padding:8px 14px;color:var(--teal);font-weight:800;background:var(--card);margin-top:6px}

/* about */
.about p{margin-bottom:10px}
.about .src{background:#fbf8f1;border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.95em}

/* new features */
#totop{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:19;width:48px;height:48px;border-radius:12px;background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#totop svg{width:26px;height:26px}
.today{display:block;background:var(--teal);color:#fff;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;text-align:left;width:100%;padding:0}
.today .hero{background:#12403c;display:flex;align-items:center;justify-content:center;min-height:200px;max-height:62vh}
.today .hero img{width:100%;max-height:62vh;object-fit:contain;display:block}
.today .hero svg{width:120px;height:120px;color:#e8cf95;opacity:.9}
.today .cap{padding:12px 14px 14px}
.today .lab{font-size:.85em;font-weight:700;opacity:.9;display:flex;justify-content:space-between;gap:8px}
.today .nm{font-size:1.3em;font-weight:900;line-height:1.25;margin-top:2px}
.today .sci{font-style:italic;opacity:.92;font-size:.95em}
.today .mid{font-size:.8em;opacity:.8;margin-top:4px;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.actions .chip{justify-content:center;padding:10px 6px;white-space:normal;text-align:center}
.item.saved .thumb::after{content:"★";position:absolute;top:2px;right:5px;color:var(--sand);font-size:1.1em;text-shadow:0 0 3px #000}
.quiz-photo{border-radius:var(--radius);overflow:hidden;background:#e9e2d2;margin-bottom:12px;min-height:220px;display:flex;align-items:center;justify-content:center}
.quiz-photo img{width:100%;display:block;max-height:60vh;object-fit:contain;background:#000}
.qopts{display:grid;gap:10px}
.qopts button{border:2px solid var(--teal);border-radius:var(--radius);background:var(--card);padding:12px 14px;text-align:left;font-weight:700;line-height:1.3}
.qopts button.ok{background:#2f7a2f;border-color:#2f7a2f;color:#fff}
.qopts button.bad{background:#a33a2a;border-color:#a33a2a;color:#fff}
.qopts button:disabled{opacity:.9}
.qbar{display:flex;justify-content:space-between;font-weight:800;color:var(--teal);margin-bottom:8px}
.flash-card{border:2px solid var(--teal);border-radius:var(--radius);background:var(--card);padding:12px;text-align:center;margin-bottom:10px}
.flash-card .ans{font-size:1.4em;font-weight:900;margin-top:8px}
.field{margin:8px 0}
.field label{display:block;font-weight:800;color:var(--teal);font-size:.92em;margin-bottom:4px}
.field input,.field textarea{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--card);font:inherit;color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pick button{text-align:left;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-weight:700}
.pick button.on{border-color:var(--teal);background:#e6f0ee}
.rec{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.rec .nm{font-weight:800}
.rec .meta{color:var(--ink2);font-size:.92em;font-weight:600}
.rec .del{color:var(--rust);font-weight:800;margin-top:6px}
/* lang picker overlay */
#lpick{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#lpick .box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:400px}
#lpick .langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#lpick .langs button{border:2px solid var(--teal);border-radius:10px;padding:14px 6px;font-weight:800;font-size:1.1em;color:var(--teal)}
#lpick .langs button.on{background:var(--teal);color:#fff}

@media(min-width:640px){.photos{grid-template-columns:1fr 1fr}.list{display:grid;grid-template-columns:1fr 1fr}.item{align-self:start}}
</style>
<link rel="stylesheet" href="journal.css">
</head>
<body>

<div id="gate" class="hide">
  <svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#ico-app"/></svg>
  <h2 id="gate-title">台江昆蟲圖鑑</h2>
  <div class="sub">台江昆虫图鉴 · Taijiang Insects<br>Serangga Taijiang</div>
  <div class="langs">
    <button data-lang="hans">简体中文</button>
    <button data-lang="hant">繁體中文</button>
    <button data-lang="en">English</button>
    <button data-lang="ms">Malay</button>
  </div>
</div>

<div id="lpick" class="hide">
  <div class="box">
    <div class="langs">
      <button data-lang="hans">简体中文</button>
      <button data-lang="hant">繁體中文</button>
      <button data-lang="en">English</button>
      <button data-lang="ms">Malay</button>
    </div>
  </div>
</div>

<header>
  <div class="hbar">
    <button class="hbtn back hide" id="btn-back" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="h-title">台江昆蟲圖鑑</h1>
    <button class="hbtn" id="btn-fs" aria-label="text size">Aa</button>
    <button class="hbtn" id="btn-lang" aria-label="language">繁中</button>
  </div>
</header>

<main id="main"></main>
<button id="totop" class="hide" aria-label="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg></button>

<nav class="tabs" id="tabs">
  <button data-view="browse"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span></span></button>
  <button data-view="identify"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.5h5M10.5 8v5"/></svg><span></span></button>
  <button data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg><span></span></button>
  <button data-view="learn"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5M8 7h8M8 10.5h8"/></svg><span></span></button>
  <button data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.8" fill="currentColor" stroke="none"/><rect x="2.5" y="4.5" width="19" height="15" rx="3"/></svg><span></span></button>
</nav>

<!-- original illustrations: order glyphs, habitat icons, app icon -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="ico-app" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="26" fill="#214e40"/>
  <ellipse cx="60" cy="56" rx="7" ry="7" fill="#f4efe4"/>

  <path d="M63 62 C 90 50, 108 56, 110 68 C 108 78, 86 74, 63 68 Z" fill="#d9b26a" opacity=".95"/>

</symbol>
<!-- orders -->

const photoUrl = (s,i=0)=> i===0 ? `img/p${s.p}.jpg` : `img/p${s.p}-${i+1}.jpg`;

const todaySpecies = ()=>{ const arr=withPhoto().length?withPhoto():DATA.species; return arr[(dayIndex()*7919)%arr.length]; }; // 7919 is coprime with 180: each species once per 180 days, never book-neighbours on consecutive days

}

function goBack(){ if(history_.length){ detailPage=history_.pop(); } else { detailPage=null; } render(); window.scrollTo(0,0); }

/* ===================== helpers ===================== */
const byPage = {}; DATA.species.forEach(s=>byPage[s.p]=s);
function orderName(k){ return ORDERS[k][lang]; }
function orderGlyph(k,cls=""){ return `<svg class="${cls}" viewBox="0 0 64 64"><use href="#o-${k}"/></svg>`; }
function badgeTag(s){ if(!s.badge) return ""; return `<span class="tag ${s.badge}">${esc(T()[s.badge])}</span>`; }
function sizeText(s){ if(!s.size) return ""; const lab=T()[s.st==="wingspan"?"wingspan":s.st==="forewing"?"forewing":"size"]; const v = s.size[0]===s.size[1]? `${s.size[0]}` : `${s.size[0]}–${s.size[1]}`; return `${lab} ${v} mm`; }
function sizeBand(s){ if(!s.size) return -1; const m=(s.size[0]+s.size[1])/2; return SIZE_BANDS.findIndex(b=>m>=b[0]&&m<b[1]); }
function searchHit(s,q){ q=q.trim().toLowerCase(); if(!q) return true; return [s.name.hans,s.name.hant,s.name.en,s.name.ms,s.sci,s.fam,s.famzh.hans,s.famzh.hant,s.al.hant,s.al.hans].some(x=>x&&x.toLowerCase().includes(q)); }

function itemHTML(s){
  const now = s.m.includes(curMonth());
  return `<button class="item ${saved.has(s.p)?"saved":""}" data-p="${s.p}">
    <div class="thumb">${orderGlyph(s.order)}${s.ph?`<img src="${photoUrl(s)}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>
    <div class="t"><div class="nm">${esc(nm(s))}</div>
    <div class="sci" lang="la" translate="no">${esc(s.sci)}</div>
    <div class="meta">${s.size?`<span class="tag">${esc(sizeText(s))}</span>`:""}${now?`<span class="tag now">${esc(T().now)}</span>`:""}${badgeTag(s)}</div></div></button>`;
}
function listHTML(arr, grouped=true){
  if(!arr.length) return `<p class="muted">${esc(T().noResult)}</p>`;
  if(!grouped) return `<div class="list">${arr.map(itemHTML).join("")}</div>`;
  let out=""; ORDER_KEYS.forEach(k=>{ const g=arr.filter(s=>s.order===k); if(!g.length) return;
    out+=`<div class="order-head">${orderGlyph(k)}<span>${esc(orderName(k))} <span class="n muted">(${g.length})</span></span></div><div class="list">${g.map(itemHTML).join("")}</div>`; });
  return out;
}
function bindItems(){ document.querySelectorAll(".item[data-p]").forEach(b=>b.addEventListener("click",()=>openSpecies(Number(b.dataset.p)))); }

/* ===================== views ===================== */
function render(){
  if(!lang){ $("#gate").classList.remove("hide"); return; }
  const t=T();
  $("#btn-lang").textContent=t.short;
  document.querySelectorAll("nav.tabs button").forEach((b,i)=>{ b.querySelector("span").textContent=t.tabs[i]; b.classList.toggle("on",b.dataset.view===view); });
  const back = detailPage!==null;
  $("#btn-back").classList.toggle("hide",!back);
  $("#h-title").textContent = back ? nm(byPage[detailPage]) : t.appTitle;
  const m=$("#main");
  if(back){ m.innerHTML=detailHTML(byPage[detailPage]); bindDetail(); return; }
  ({browse:renderBrowse,identify:renderIdentify,calendar:renderCalendar,learn:renderLearn,more:renderMore})[view]();
}

function renderBrowse(){
  const t=T(); const m=$("#main");
  const td = todaySpecies();
  const todayCard = `<button class="today" data-p="${td.p}"><div class="hero">${td.ph?`<img src="${photoUrl(td)}" alt="${esc(nm(td))}" onerror="this.remove()">`:orderGlyph(td.order)}</div><div class="cap"><div class="lab"><span>${esc(t.today)}</span><span>${esc(orderName(td.order))}</span></div><div class="nm">${esc(nm(td))} ›</div><div class="sci" lang="la" translate="no">${esc(td.sci)}</div><div class="mid">${esc(t.midnight)}</div></div></button>`;
  const chips = [`<button class="chip ${browse.order==="all"?"on":""}" data-o="all">${esc(t.all)} <span class="n">${DATA.species.length}</span></button>`,
                 `<button class="chip ${browse.order==="saved"?"on":""}" data-o="saved">★ ${esc(t.saved)} <span class="n">${saved.size}</span></button>`]
    .concat(ORDER_KEYS.map(k=>`<button class="chip ${browse.order===k?"on":""}" data-o="${k}">${orderGlyph(k)}${esc(orderName(k))} <span class="n">${DATA.species.filter(s=>s.order===k).length}</span></button>`));
  const inScope = s => browse.order==="all" || (browse.order==="saved" ? saved.has(s.p) : s.order===browse.order);
  const arr = DATA.species.filter(s=>inScope(s)&&searchHit(s,browse.q));
  m.innerHTML = `${browse.q||browse.order!=="all"?"":todayCard}<div class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="q" type="search" placeholder="${esc(t.search)}" value="${esc(browse.q)}" autocomplete="off"></div>
    <div class="order-menu"><button class="order-toggle" aria-expanded="false" aria-label="${esc(t.tabs[0])}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="order-tiles">${chips.join("")}</div></div>
    <div class="count">${arr.length} ${esc(t.species)}</div><div id="browse-results">${listHTML(arr)}</div>`;
  $(".order-toggle").addEventListener("click",e=>{const b=e.currentTarget; const expanded=b.getAttribute("aria-expanded")!=="true"; b.setAttribute("aria-expanded",String(expanded)); b.parentElement.classList.toggle("expanded",expanded);});
  const q=$("#q"); q.addEventListener("input",()=>{ browse.q=q.value; const arr2=DATA.species.filter(s=>inScope(s)&&searchHit(s,browse.q)); $(".count").textContent=`${arr2.length} ${t.species}`; $("#browse-results").innerHTML=listHTML(arr2); bindItems(); });
  document.querySelectorAll(".chip[data-o]").forEach(b=>b.addEventListener("click",()=>{ browse.order=b.dataset.o; renderBrowse(); }));
  $(".today")?.addEventListener("click",e=>openSpecies(Number(e.currentTarget.dataset.p)));
  bindItems();
}

function detailHTML(s){
  const t=T(); const cur=curMonth();
  const photos = s.ph ? Array.from({length:s.ph},(_,i)=>`<div class="ph"><img src="${photoUrl(s,i)}" alt="${esc(nm(s))}" loading="${i?"lazy":"eager"}" onerror="this.parentNode.remove()"></div>`).join("")
                      : `<div class="ph">${orderGlyph(s.order)}<div class="nophoto">${esc(t.noPhoto)}</div></div>`;
  const months = t.monthNames.map((n,i)=>`<div class="${s.m.includes(i+1)?"on":""} ${i+1===cur?"cur":""}">${i+1}</div>`).join("");
  const tags = HAB_KEYS.filter(k=>s.hab.includes(k)).map(k=>`<span class="ht hab"><svg viewBox="0 0 24 24"><use href="#h-${k}"/></svg>${esc(t.hab[k])}</span>`).join("")
    + MIC_KEYS.filter(k=>s.mic.includes(k)).map(k=>`<span class="ht mic"><svg viewBox="0 0 24 24"><use href="#m-${k}"/></svg>${esc(t.mic[k])}</span>`).join("")
    + ACT_KEYS.filter(k=>s.act.includes(k)).map(k=>`<span class="ht act"><svg viewBox="0 0 24 24"><use href="#a-${k}"/></svg>${esc(t.act[k])}</span>`).join("");
  const ruler = s.size ? rulerSVG(s) : "";
  const idx = DATA.species.indexOf(s); const prev=DATA.species[idx-1], next=DATA.species[idx+1];
  const al = s.al[lang==="hans"?"hans":lang==="hant"?"hant":"hant"]; // aliases are Chinese names from the source
  return `<div class="photos">${photos}</div>
    <h2 class="dname">${esc(nm(s))}</h2>
    <div class="dsci" lang="la" translate="no">${esc(s.sci)}</div>
    <div class="taxo"><span class="tag">${orderGlyph(s.order,"")} ${esc(orderName(s.order))}</span><span class="tag">${esc(s.fam)}${(lang==="hans"||lang==="hant")?" · "+esc(s.famzh[lang]):""}</span>${badgeTag(s)}<span class="tag">${esc(t.bookPage)} ${s.p}</span></div>
    <div class="actions"><button class="chip ${saved.has(s.p)?"on":""}" id="btn-save">${esc(saved.has(s.p)?t.unsave:t.save)}</button><button class="chip" id="btn-record">${esc(t.record)}</button></div>
    ${s.size?`<div class="sec">${esc(sizeText(s))}</div><div class="ruler">${ruler}</div>`:""}
    <div class="sec">${esc(t.months)}</div><div class="months-wrap"><div class="months">${months}</div></div>
    <div class="sec">${esc(t.habitat)} · ${esc(t.micro)} · ${esc(t.activity)}</div><div class="tagrow">${tags}</div>
    <div class="sec">${esc(t.idTitle)}</div><p>${esc(s.id[lang])}</p>
    <div class="sec">${esc(t.habitsTitle)}</div><p>${esc(s.hb[lang])}</p>
    <div class="sec">${esc(t.rangeTitle)}</div><p>${esc(s.rg[lang])}</p>
    ${al?`<div class="sec">${esc(t.aliasTitle)}</div><p>${esc(al)}</p>`:""}
    <div class="prevnext">${prev?`<button data-p="${prev.p}"><small>‹ ${esc(t.prev)}</small>${esc(nm(prev))}</button>`:"<span></span>"}${next?`<button class="next" data-p="${next.p}"><small>${esc(t.next)} ›</small>${esc(nm(next))}</button>`:""}</div>`;
}
function rulerSVG(s){
  // scale bar: insect length against a 1 cm reference, capped at 100 mm visual range
  const max = Math.max(10, Math.min(100, s.size[1]*1.15));
  const W=600, pad=20, w=W-2*pad, px=v=>pad+v/max*w;
  const a=px(s.size[0]), b=px(s.size[1]);
  const ticks=[]; for(let v=0; v<=max; v+=10){ ticks.push(`<line x1="${px(v)}" y1="26" x2="${px(v)}" y2="34" stroke="#2f3a38" stroke-width="2"/><text x="${px(v)}" y="46" font-size="11" text-anchor="middle" fill="#2f3a38" font-weight="700">${v}</text>`); }
  return `<svg viewBox="0 0 ${W} 50" preserveAspectRatio="none" style="height:50px"><rect x="${a}" y="6" width="${Math.max(4,b-a)}" height="18" rx="4" fill="#e4852b"/><line x1="${px(s.size[0])}" y1="6" x2="${px(s.size[0])}" y2="24" stroke="#9a4a3a" stroke-width="2"/><line x1="${pad}" y1="30" x2="${W-pad}" y2="30" stroke="#2f3a38" stroke-width="2"/>${ticks.join("")}<text x="${W-pad}" y="20" font-size="11" text-anchor="end" fill="#2f3a38" font-weight="700">mm</text></svg>`;
}
function bindDetail(){
  document.querySelectorAll(".prevnext button[data-p]").forEach(b=>b.addEventListener("click",()=>{ detailPage=Number(b.dataset.p); render(); window.scrollTo(0,0); }));
  $("#btn-save").addEventListener("click",()=>{ const p=detailPage; if(saved.has(p)) saved.delete(p); else saved.add(p); store.set("tj_saved",[...saved]); render(); });
  $("#btn-record").addEventListener("click",()=>{ nbForm.species=detailPage; nbForm.q=""; detailPage=null; history_=[]; view="more"; moreOpen="notebook"; render(); setTimeout(()=>$("#sec-notebook")?.scrollIntoView({behavior:"smooth"}),50); });
}

function renderIdentify(){
  const t=T(); const m=$("#main");
  const grp=(label,keys,cur,field,cols,ico)=>`<div class="sec">${esc(label)}</div><div class="bgrp ${cols}">${keys.map(k=>`<button class="chip ${cur===k?"on":""}" data-f="${field}" data-v="${k}">${ico?ico(k):""}${esc(k==="__any"?t.anyAct:k==="__anyM"?t.anyTime:field==="hab"?t.hab[k]:field==="mic"?t.mic[k]:field==="act"?t.act[k]:field==="size"?t.sizes[k]:orderName(k))}</button>`).join("")}</div>`;
  const monthBtns = `<div class="sec">${esc(t.when)}</div><div class="bgrp c6">${t.monthNames.map((n,i)=>`<button class="chip ${ident.month===i+1?"on":""}" data-f="month" data-v="${i+1}">${n}</button>`).join("")}</div><div class="bgrp c2"><button class="chip ${ident.month===null?"on":""}" data-f="month" data-v="__anyM">${esc(t.anyTime)}</button></div>`;
  const res = DATA.species.filter(s=>(!ident.hab||s.hab.includes(ident.hab))&&(!ident.mic||s.mic.includes(ident.mic))&&(ident.month===null||s.m.includes(ident.month))&&(!ident.act||s.act.includes(ident.act))&&(ident.size===null||sizeBand(s)===ident.size)&&(!ident.order||s.order===ident.order));
  m.innerHTML = `<p>${esc(t.idIntro)}</p>
    <div class="card"><h3>${esc(t.keyTitle)}</h3>${keyHTML()}</div>
    ${grp(t.where,HAB_KEYS,ident.hab,"hab","c2",k=>`<svg viewBox="0 0 24 24"><use href="#h-${k}"/></svg>`)}
    ${grp(t.on,MIC_KEYS,ident.mic,"mic","c2",k=>`<svg viewBox="0 0 24 24"><use href="#m-${k}"/></svg>`)}
    ${monthBtns}
    ${grp(t.dayNight,ACT_KEYS.concat("__any"),ident.act===null?"__any":ident.act,"act","c3",k=>k==="__any"?"":`<svg viewBox="0 0 24 24"><use href="#a-${k}"/></svg>`)}
    ${grp(t.sizeQ,[0,1,2,3,4],ident.size,"size","c3")}
    ${grp(t.group,ORDER_KEYS,ident.order,"order","c2",k=>orderGlyph(k))}
    <div class="bgrp c2"><button class="chip" id="reset">${esc(t.reset)}</button></div>
    <div class="count" id="res-count">${esc(t.results)}: ${res.length}</div><div id="res">${listHTML(res)}</div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
    const f=b.dataset.f, v=b.dataset.v;
    if(f==="month"){ ident.month = v==="__anyM"?null:Number(v); }
    else if(f==="act"){ ident.act = v==="__any"?null:v; }
    else if(f==="size"){ ident.size = ident.size===Number(v)?null:Number(v); }
    else { ident[f] = ident[f]===v?null:v; }
    renderIdentify(); window.scrollTo(0,0);
  }));
  $("#reset").addEventListener("click",()=>{ Object.assign(ident,{hab:null,mic:null,month:curMonth(),act:null,size:null,order:null}); renderIdentify(); });
  bindKey(); bindItems();
}

function keyHTML(){
  const t=T(); const n=KEY[keyNode];
  if(!n){ // result = order key
    const k=keyNode; const cnt=DATA.species.filter(s=>s.order===k).length;
    return `<div class="key-res"><div class="big">${orderGlyph(k,"")} ${esc(orderName(k))}</div><div class="muted">${k} · ${cnt} ${esc(t.species)}</div>${cnt?`<button class="linkbtn" id="key-go" data-o="${k}">${esc(t.keyGo)}</button>`:`<p>${esc(t.keyNone)}</p>`}</div><button class="chip" id="key-restart">${esc(t.keyRestart)}</button>`;

function bindKey(){

function renderCalendar(){
  const t=T(); const m=$("#main");
  const counts = Array.from({length:12},(_,i)=>DATA.species.filter(s=>s.m.includes(i+1)).length);
  const mx=Math.max(...counts);
  const bars = `<svg viewBox="0 0 600 150" style="width:100%;height:auto;display:block">${counts.map((c,i)=>`<rect x="${i*50+6}" y="${120-c/mx*100}" width="38" height="${c/mx*100}" rx="4" fill="${i+1===calMonth?"#e4852b":"#d9b26a"}"/><text x="${i*50+25}" y="${114-c/mx*100}" font-size="13" text-anchor="middle" font-weight="700" fill="#2f3a38">${c}</text><text x="${i*50+25}" y="142" font-size="14" text-anchor="middle" font-weight="700" fill="${i+1===calMonth?"#9a4a3a":"#2f3a38"}">${esc(t.monthNames[i])}</text>`).join("")}</svg>`;

  m.innerHTML = `<p>${esc(t.calIntro)}</p>

  document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{ calMonth=Number(b.dataset.m); renderCalendar(); }));

  const g='fill="none" stroke="#1a1f1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
  const egg=`<ellipse cx="0" cy="0" rx="14" ry="18" fill="#f1d9a7"/>`;
  const mini=s=>`<g transform="scale(${s})"><ellipse cx="0" cy="0" rx="22" ry="12" fill="#d9b26a"/><circle cx="-26" cy="-2" r="8" fill="#f1d9a7"/><path d="M-10 -12l-6-12M-10 12l-6 12M8 -12l0-14M8 12l0 14M-32 -8l-8-10M-30 -9l-6-13"/></g>`;
  const adult=`<g><ellipse cx="0" cy="0" rx="22" ry="12" fill="#d9b26a"/><circle cx="-26" cy="-2" r="8" fill="#f1d9a7"/><path d="M-6 -8c20-24 46-22 50-8-14 2-34 10-50 8Z" fill="#dfe8ec"/><path d="M-10 -12l-6-12M-10 12l-6 12M8 -12l0-14M8 12l0 14M-32 -8l-8-10M-30 -9l-6-13"/></g>`;
  const larva=`<g><path d="M-26 0c6-10 12-10 18 0s12 10 18 0 12-10 18 0" stroke-width="10" stroke="#8fa36b" fill="none" stroke-linecap="round"/><circle cx="-30" cy="0" r="7" fill="#f1d9a7"/></g>`;
  const pupa=`<g><path d="M-10 -22c14 0 20 10 20 24 0 12-8 22-20 22-6 0-10-10-10-22 0-14 4-24 10-24Z" fill="#b89b6a"/><path d="M-14 -10h14M-16 0h16M-14 10h12" stroke="#7a6240"/></g>`;
  const stages = type===0?[egg,mini(.6),mini(.8),adult] : type===1?[egg,mini(.55),mini(.8),adult] : [egg,larva,pupa,adult];
  const n=stages.length, W=600, step=W/n;
  return `<svg viewBox="0 0 600 110"><g ${g}>${stages.map((s,i)=>`<g transform="translate(${step*i+step/2},55)">${s}</g>${i<n-1?`<path d="M${step*(i+1)-18} 55h14M${step*(i+1)-10} 49l6 6-6 6" stroke="#9a4a3a"/>`:""}`).join("")}</g></svg>`;
}

/* ---- photo identification ---- */
let moreOpen = null;
function renderMore(){
  const t=T(); const m=$("#main");
  const sec=(key,title,body)=>`<details class="lrn" id="sec-${key}" ${moreOpen===key?"open":""}><summary>${title}</summary><div class="body" id="body-${key}">${body}</div></details>`;
  m.innerHTML = sec("quiz",esc(t.more.quiz),quizHTML()) + sec("flash",esc(t.more.flash),flashHTML()) + sec("notebook",esc(t.more.notebook),notebookHTML()) + sec("about",esc(t.more.about),aboutHTML());
  document.querySelectorAll("details.lrn").forEach(d=>d.addEventListener("toggle",()=>{ if(d.open) moreOpen=d.id.replace("sec-",""); else if(moreOpen===d.id.replace("sec-","")) moreOpen=null; }));
  bindQuiz(); bindFlash(); bindNotebook();
}
/* ---- photo quiz ---- */
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function startQuiz(){
  const pool=withPhoto(); const qs=shuffle(pool).slice(0,10).map(ans=>{
    const same=pool.filter(x=>x.order===ans.order&&x.p!==ans.p); const other=pool.filter(x=>x.p!==ans.p&&x.order!==ans.order);
    const d=shuffle(same).slice(0,3); while(d.length<3){ d.push(shuffle(other).find(x=>!d.includes(x))); }
    return {ans, opts:shuffle([ans,...d]), photo:0};
  });
  Object.assign(quiz,{on:true,qs,i:0,score:0,answered:false});
}
function quizHTML(){
  const t=T().quiz;
  if(!withPhoto().length) return `<p class="muted">${esc(T().noPhoto)}</p>`;
  if(!quiz.on) return `<p>${esc(t.intro)}</p><div class="bgrp c2"><button class="chip on" id="quiz-start">${esc(t.start)}</button></div>`;
  if(quiz.i>=quiz.qs.length) return `<div class="key-res"><div class="big">${esc(t.done)}</div><p>${esc(t.score)}: ${quiz.score} / ${quiz.qs.length}</p><button class="linkbtn" id="quiz-start">${esc(t.again)}</button></div>`;
  const q=quiz.qs[quiz.i];
  return `<div class="qbar"><span>${quiz.i+1} / ${quiz.qs.length}</span><span>${esc(t.score)}: ${quiz.score}</span></div>
    <div class="quiz-photo"><img src="${photoUrl(q.ans,q.photo)}" alt=""></div><div class="key-q">${esc(t.q)}</div>
    <div class="qopts">${q.opts.map(o=>`<button data-q="${o.p}" ${quiz.answered?"disabled":""} class="${quiz.answered?(o.p===q.ans.p?"ok":(o.p===quiz.pick?"bad":"")):""}">${esc(nm(o))}<br><small class="muted" style="color:inherit;opacity:.85">${esc(o.sci)}</small></button>`).join("")}</div>
    ${quiz.answered?`<p style="margin-top:10px;font-weight:800">${quiz.pick===q.ans.p?esc(t.ok):esc(t.bad)+" "+esc(nm(q.ans))}</p><div class="bgrp c2"><button class="chip on" id="quiz-next">${esc(t.next)}</button><button class="chip" data-p="${q.ans.p}" id="quiz-open">${esc(nm(q.ans))} ›</button></div>`:""}`;
}
function bindQuiz(){
  const re=()=>{ $("#body-quiz").innerHTML=quizHTML(); bindQuiz(); };
  $("#quiz-start")?.addEventListener("click",()=>{ startQuiz(); re(); });
  document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{ if(quiz.answered) return; quiz.pick=Number(b.dataset.q); quiz.answered=true; if(quiz.pick===quiz.qs[quiz.i].ans.p) quiz.score++; re(); }));
  $("#quiz-next")?.addEventListener("click",()=>{ quiz.i++; quiz.answered=false; re(); });
  $("#quiz-open")?.addEventListener("click",e=>openSpecies(Number(e.currentTarget.dataset.p)));
}
/* ---- flashcards ---- */
function flashHTML(){
  const t=T().flash; const pool=withPhoto(); if(!pool.length) return `<p class="muted">${esc(T().noPhoto)}</p>`;
  if(flash.p===null) flash.p=pool[Math.floor(Math.random()*pool.length)].p;
  const s=byPage[flash.p];
  return `<p>${esc(t.intro)}</p><div class="flash-card" id="flash-card"><div class="quiz-photo" style="margin-bottom:8px"><img src="${photoUrl(s)}" alt=""></div>
    ${flash.flipped?`<div class="ans">${esc(nm(s))}</div><div class="muted" style="font-style:italic">${esc(s.sci)}</div><div class="muted">${esc(orderName(s.order))} · ${esc(s.fam)}</div>`:`<div class="muted" style="font-weight:800">${esc(t.flip)}</div>`}</div>
    <div class="bgrp c2"><button class="chip on" id="flash-next">${esc(t.next)}</button>${flash.flipped?`<button class="chip" id="flash-open">${esc(nm(s))} ›</button>`:""}</div>`;
}
function bindFlash(){
  const re=()=>{ $("#body-flash").innerHTML=flashHTML(); bindFlash(); };
  $("#flash-card")?.addEventListener("click",()=>{ flash.flipped=!flash.flipped; re(); });
  $("#flash-next")?.addEventListener("click",()=>{ const pool=withPhoto(); let n; do{ n=pool[Math.floor(Math.random()*pool.length)].p; }while(n===flash.p&&pool.length>1); flash.p=n; flash.flipped=false; re(); });
  $("#flash-open")?.addEventListener("click",()=>openSpecies(flash.p));
}
/* ---- field notebook ---- */
function todayISO(){ return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function notebookHTML(){
  const t=T().nb;
  const sel = nbForm.species ? byPage[nbForm.species] : null;
  const hits = nbForm.q.trim() ? DATA.species.filter(s=>searchHit(s,nbForm.q)).slice(0,6) : [];
  const list = notes.length ? notes.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(r=>{ const sp=byPage[r.p]; return `<div class="rec"><div class="nm">${sp?esc(nm(sp)):esc(t.noSpecies)}</div><div class="meta">${esc(r.date||"")}${r.place?" · "+esc(r.place):""}</div>${r.note?`<div>${esc(r.note)}</div>`:""}<button class="del" data-del="${r.id}">${esc(t.del)}</button></div>`; }).join("") : `<p class="muted">${esc(t.empty)}</p>`;
  return `<p>${esc(t.intro)}</p>
    <div class="card"><div class="field"><label>${esc(t.species)}</label>${sel?`<div class="pick"><button class="on" id="nb-clear">★ ${esc(nm(sel))} <span class="muted">(${esc(sel.sci)})</span></button></div>`:`<input id="nb-q" type="search" placeholder="${esc(t.pick)}" value="${esc(nbForm.q)}" autocomplete="off"><div class="pick" id="nb-hits">${hits.map(h=>`<button data-sel="${h.p}">${esc(nm(h))} <span class="muted">${esc(h.sci)}</span></button>`).join("")}</div>`}</div>
    <div class="field"><label>${esc(t.date)}</label><input id="nb-date" type="date" value="${todayISO()}"></div>
    <div class="field"><label>${esc(t.place)}</label><input id="nb-place" type="text" autocomplete="off"></div>
    <div class="field"><label>${esc(t.note)}</label><textarea id="nb-note"></textarea></div>
    <div class="bgrp c2"><button class="chip on" id="nb-add">${esc(t.add)}</button></div></div>
    <div class="count">${notes.length} ${esc(t.count)}</div>${list}
    <div class="bgrp c2"><button class="chip" id="nb-export">${esc(t.export)}</button><button class="chip" id="nb-import">${esc(t.import)}</button></div><input type="file" id="nb-file" accept="application/json" class="hide">`;
}
function bindNotebook(){
  const re=()=>{ $("#body-notebook").innerHTML=notebookHTML(); bindNotebook(); };
  const q=$("#nb-q"); q?.addEventListener("input",()=>{ nbForm.q=q.value; const hits=nbForm.q.trim()?DATA.species.filter(s=>searchHit(s,nbForm.q)).slice(0,6):[]; $("#nb-hits").innerHTML=hits.map(h=>`<button data-sel="${h.p}">${esc(nm(h))} <span class="muted">${esc(h.sci)}</span></button>`).join(""); bindSel(); });
  const bindSel=()=>document.querySelectorAll("[data-sel]").forEach(b=>b.addEventListener("click",()=>{ nbForm.species=Number(b.dataset.sel); re(); }));
  bindSel();
  $("#nb-clear")?.addEventListener("click",()=>{ nbForm.species=null; nbForm.q=""; re(); });
  $("#nb-add")?.addEventListener("click",()=>{ notes.push({id:Date.now().toString(36),p:nbForm.species,date:$("#nb-date").value,place:$("#nb-place").value.trim(),note:$("#nb-note").value.trim(),lang}); store.set("tj_notes",notes); nbForm.species=null; nbForm.q=""; re(); });
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{ notes=notes.filter(r=>r.id!==b.dataset.del); store.set("tj_notes",notes); re(); }));
  $("#nb-export")?.addEventListener("click",()=>{ const out=notes.map(r=>({...r,species:byPage[r.p]?{zh:byPage[r.p].name.hant,en:byPage[r.p].name.en,sci:byPage[r.p].sci}:null})); const blob=new Blob([JSON.stringify({app:"taijiang-insects",version:VERSION,exported:new Date().toISOString(),saved:[...saved],notes:out},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`taijiang-notes-${todayISO()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); });
  $("#nb-import")?.addEventListener("click",()=>$("#nb-file").click());
  $("#nb-file")?.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(txt=>{ const d=JSON.parse(txt); const inc=Array.isArray(d)?d:(d.notes||[]); const ids=new Set(notes.map(r=>r.id)); inc.forEach(r=>{ if(r&&r.id&&!ids.has(r.id)) notes.push({id:String(r.id),p:Number(r.p)||null,date:String(r.date||""),place:String(r.place||""),note:String(r.note||""),lang:r.lang||lang}); }); (d.saved||[]).forEach(p=>saved.add(Number(p))); store.set("tj_notes",notes); store.set("tj_saved",[...saved]); re(); }).catch(()=>alert("!")); });
}
function aboutHTML(){
  const t=T().about;
  return `<div class="about"><p>${esc(t.p1)}</p><p>${esc(t.p2)}</p>
    <div class="card"><h3>${esc(t.src)}</h3><div class="src"><p>${esc(t.srcText)}</p><p>${esc(t.photo)}</p></div></div>
    <p class="muted">${esc(t.ver)} ${esc(VERSION)} · GitHub: stanleywoosweeleong</p></div>`;
}

/* ===================== boot ===================== */
render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
